services:
  mission-control:
    build: .
    ports:
      - "8095:8095"
    volumes:
      - ./data:/app/data
      - ~/.ssh:/root/.ssh:ro
    environment:
      OC_TOKEN: "${OC_TOKEN}"
      SSH_USER: "jamil"
      SSH_KEY_PATH: "/root/.ssh/id_ed25519"
      PI1_HOST: "192.0.2.101"
      PI2_HOST: "192.0.2.102"
      PI3_HOST: "192.0.2.103"
      PORT: "8095"
      USE_WSL_SSH: "false"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
